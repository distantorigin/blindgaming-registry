[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "blindgaming-registry-validator"
version = "1.2.1"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["jsonschema>=4.23,<5", "referencing>=0.35,<1"]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
    "pyyaml>=6,<7",
]

[project.scripts]
blindgaming-registry = "blindgaming_registry_validator.cli:entrypoint"

[tool.hatch.build.targets.wheel]
packages = ["validator/src/blindgaming_registry_validator"]

[tool.hatch.build.targets.wheel.force-include]
"schemas/v1" = "blindgaming_registry_validator/_schemas/v1"
