name: Submission check

"on":
  issues:
    types: [opened, edited]

permissions:
  contents: read

jobs:
  check:
    name: submission-check
    if: contains(github.event.issue.labels.*.name, 'registry')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout registry and validator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: 0.10.0
      - name: Install validator
        run: uv sync --locked --extra test
      - name: Validate the proposed record
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python .github/scripts/extract_record.py > /tmp/report.txt 2>&1 || true
          cat /tmp/report.txt
      - name: Build the comment
        env:
          REPORT_PATH: /tmp/report.txt
        run: |
          {
            echo "Automated validation of the proposed record:"
            echo
            echo '```'
            head -c 60000 "$REPORT_PATH"
            echo
            echo '```'
            echo
            echo "This is a check, not an approval. A curator reviews factual accuracy separately."
          } > /tmp/comment.md
      - name: Comment the result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --body-file /tmp/comment.md
